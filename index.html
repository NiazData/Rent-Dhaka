<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iman Homes — Rent, Buy, and Build Properties in Dhaka</title>
    <meta
      name="description"
      content="Iman Homes connects renters, buyers, and landowners with verified properties and ready-built apartments across Dhaka, Bangladesh."
    />
  </head>
  <body>
    <div id="root"></div>
    <form name="tour-request" data-netlify="true" hidden>
      <input type="text" name="listingSlug" />
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="date" name="preferredDate" />
      <textarea name="message"></textarea>
    </form>
    <form name="rental-application" data-netlify="true" hidden>
      <input type="text" name="listingSlug" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="employer" />
      <input type="text" name="position" />
      <input type="number" name="monthlyIncomeBDT" />
      <input type="text" name="previousAddress" />
      <input type="text" name="previousLandlordContact" />
      <input type="file" name="nidFile" />
      <input type="file" name="incomeProofFile" />
    </form>
    <form name="contact-message" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
